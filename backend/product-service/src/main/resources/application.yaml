server:
  port: 8082

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shopkart_product
    username: postgres
    password: password # <-- Replace with your PostgreSQL password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Automatically creates tables for Category, Product, ProductVariant, ProductImage
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis Configuration for Product & Category Caching
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes cache TTL
      cache-null-values: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# AWS S3 Configuration for Pre-Signed Image Uploads
aws:
  s3:
    bucket-name: shopkart-media-ch
    region: ap-south-1 # <-- Set to your actual region code!
    access-key: ${AWS_ACCESS_KEY_ID:YOUR_AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY:YOUR_AWS_SECRET_ACCESS_KEY}
    cdn-url: https://shopkart-media-ch.s3.ap-south-1.amazonaws.com # Direct S3 public URL format

management:
  tracing:
    sampling:
      probability: 1.0 # 100% distributed trace sampling
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"







